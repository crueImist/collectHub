spring.application.name=collecthub
server.port=8080

# Archivo OPCIONAL con configuración propia de cada integrante (no se sube a GitHub).
# Sirve para cambiar usuario/clave de MySQL sin tocar este archivo. Ver application-local.properties.example
spring.config.import=optional:file:./application-local.properties

#Clase 2
#Para definir el formato de despliegue de fecha/hora del log en la consola
logging.pattern.dateformat=hh:mm

#Para eliminar mensajes invasivos de Spring
spring.main.banner-mode=off

#En desarrollo el "cache" del servidor (false), en producción "true"
spring.thymeleaf.cache=false

#Clase 3
#Conexion local a la BD collecthub en MySQL (se crea con database/00_crear_bd.sql)
spring.datasource.url=jdbc:mysql://localhost:3306/collecthub

#Usuario y clave de database/00_crear_bd.sql (solo para desarrollo local)
spring.datasource.username=collecthub_user
spring.datasource.password=Collecthub_2026

#Driver y plataforma de comunicacion
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#Mostrar informacion en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

#Clase 4
#Esta información se utiliza para obtener acceso a su storage (imágenes).
#El archivo JSON de credenciales NO está en GitHub: cada integrante lo coloca en
#src/main/resources/firebase/ con el nombre firebase-credentials.json (ver README).
firebase.bucket.name=techshop-b17a5.firebasestorage.app
firebase.storage.path=collecthub
firebase.json.path=firebase
firebase.json.file=firebase-credentials.json

#Para revisar tamaño del logo
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
